      <h1>Still Wallet: crypto kept still.</h1>
      <p>A calm, privacy-first wallet for Bitcoin, Ethereum, Solana and more. Your recovery phrase never leaves your device.</p>
      <ul>
        <li>No account or email</li>
        <li>Encrypted on device</li>
        <li>Open source</li>
      </ul>
      <h2>Works with</h2>
      <p>Bitcoin, Ethereum, Solana, BNB Chain, XRP Ledger, HyperEVM, Base and Monero.</p>
      <h2>Features</h2>
      <h3>Your keys, your device</h3>
      <p>Your recovery phrase is encrypted in your browser and never sent anywhere. Set up without an account or email.</p>
      <h3>Every token on its own chain</h3>
      <p>BTC, ETH, SOL, BNB, XRP, XMR, HYPE, USDC, USDT and LINK on their native networks, with balances in your own currency.</p>
      <h3>Many wallets</h3>
      <p>Keep several wallets side by side, each with its own name and emoji, and switch in a tap.</p>
      <h3>Locks when you leave</h3>
      <p>Auto-lock from instant to 30 minutes, plus optional protection that erases the wallet after too many wrong passwords.</p>
      <h3>Quiet by default</h3>
      <p>Hide balances, pause network requests and choose your own RPC for every network.</p>
      <h3>Installs like an app</h3>
      <p>Works on phone and PC, and keeps working offline once it has loaded.</p>
      <p>Still Wallet needs JavaScript to run. <a href="/faq">FAQ</a> · <a href="/privacy">Privacy Policy</a> · <a href="/credits">Credits</a></p>
